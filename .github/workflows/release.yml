name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex.: v1.3.0)'
        required: true
        type: string
      with_portable:
        description: 'Incluir pacotes adicionais (Espanso Windows/Linux portáteis, pacote macOS, e BeefText)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar versão
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão deve seguir o padrão vX.Y.Z (recebido: '${{ inputs.version }}')"
            exit 1
          fi

      - name: Instalar dependências (zip/unzip/pyyaml/weasyprint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev
          pip install pyyaml weasyprint --break-system-packages -q

      - name: Build dos pacotes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/build_release.sh
          if [ "${{ inputs.with_portable }}" = "true" ]; then
            scripts/build_release.sh "${{ inputs.version }}" --with-portable
          else
            scripts/build_release.sh "${{ inputs.version }}"
          fi

      - name: Criar tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.pdf
