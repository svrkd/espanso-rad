    replace: "Lesão expansiva de aspecto infiltrativo, determinando espessamento parietal irregular e redução luminal do reto médio, distando cerca de _ cm da borda anal, com extensão craniocaudal de aproximadamente _ cm. Há sinais de extensão da lesão para a cúpula vaginal posterior e alteração de sinal da gordura mesorretal, sugerindo invasão. Notam-se ainda neoangiogênese locorregional e linfonodos aumentados em número nas cadeias pararretal, retal superior e pré-sacral. O conjunto de achados é sugestivo de neoplasia retal primária infiltrativa com invasão local e linfonodal."
    word: true

