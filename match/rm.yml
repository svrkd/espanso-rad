      Nota-se discreto hipersinal em T2/FLAIR na substância branca subcortical adjacente, sem evidências de efeito expansivo ou atrofia local. O conjunto de achados é sugestivo de anomalia do desenvolvimento venoso (AVD/angioma venoso).
