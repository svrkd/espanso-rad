    replace: "Lesão predominantemente cortical, de aparência borbulhante (predominantemente cística), apresentando edema vasogênico local, determinando efeito de massa, localizada na porção mesial do lobo temporal direito, com aparência sugestiva de tumor neuroepitelial disembrioplástico (DNET). Os diagnósticos diferenciais devem ser aplicados."
