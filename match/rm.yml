  - trigger: "advrm"
    label: "Anomalia do desenvolvimento venoso"
    replace: "Anomalia do desenvolvimento venoso localizada no lobo temporal direito, associada a hipersinal em T2/FLAIR da substância branca subcortical nessa topografia, sem efeito atrófico ou expansivo, sugestiva de gliose."
    word: true

  - trigger: "aneuinesp"
    label: "Aneurisma de artéria cerebral média"
    replace: "Imagem sacular em adição ao segmento M2 da artéria cerebral média esquerda, podendo representar aneurisma. Recomenda-se prosseguir investigação com angiorressonância."
    word: true

  - trigger: "aneurismaoculto"
    label: "Vasoespasmo x aneurisma roto oculto"
    replace: "Irregularidades parietais na região de bifurcação da artéria cerebral média direita, onde se observam áreas de estreitamento luminal, podendo corresponder a vasoespasmo. Associa-se hemorragia subaracnoide, notadamente na fissura sylviana, sugerindo aneurisma roto oculto. Recomenda-se prosseguir investigação com arteriografia digital."
    word: true

  - trigger: "angiomavenoso"
    label: "Angioma venoso"
    replace: "Pequena área de marcado hipossinal na sequência S.W.I., que deve resultar da presença de produtos de degradação da hemoglobina, localizada na substância branca do lobo frontal direito, junto ao corno frontal do ventrículo lateral ipsilateral, sem determinar evidente efeito expansivo local, apresentando realce pelo meio de contraste paramagnético endovenoso, sugerindo angioma venoso."
    word: true

  - trigger: "anomaliav"
    label: "Anomalia do desenvolvimento venoso"
    replace: "Após administração do meio de contraste paramagnético, foi evidenciada anomalia do desenvolvimento venoso na alta convexidade do lobo frontal esquerdo, com frequência achado incidental sem correlação clínica."
    word: true

  - trigger: "arac"
    label: "Sequela de aracnoidite"
    replace: "Agrupamento das raízes da cauda equina em L4-L5, sugerindo sequela de aracnoidite."
    word: true

  - trigger: "aracnoideweb"
    label: "Aracnoide web"
    replace: "Deslocamento focal anterior do cordão medular torácico, com alargamento do espaço dural posterior no nível de T7-T8, observando-se discreto hipersinal em T2. A possibilidade de rede aracnoide torácica dorsal pode ser considerada (aracnoide web)."
    word: true

  - trigger: "avc2"
    label: "Lesões de natureza isquêmica recente"
    replace: "Lesões corticossubcorticais, hiperintensas em T2/FLAIR, com restrição à difusão e correspondência em mapa ADC, localizadas nos lobos frontal, parietal, occipital e nucleocapsular esquerdos, com apagamento dos sulcos corticais regionais, sugerindo lesões de natureza isquêmica recente em território de irrigação da artéria cerebral média ipsilateral. Há subprodutos da degradação da hemoglobina em algumas dessas lesões, sugerindo áreas de transformação hemorrágica."
    word: true

  - trigger: "avcirm"
    label: "AVC isquêmico agudo extenso"
    replace: "Lesões caracterizadas por alto sinal em T2/FLAIR, restrição à difusão e correspondência no mapa ADC, acometendo a substância branca profunda e corticossubcortical frontal, parietal, occipital, temporal, insular e nucleocapsular à esquerda, associadas a edema de padrão citotóxico, com consequente apagamento dos sulcos entre os giros corticais e perda da diferenciação das substâncias branca/cinzenta e discreto desvio contralateral da linha média em cerca de _ cm. Outras lesões de menores dimensões e características semelhantes foram visualizadas nas regiões frontal, parietal e occipital à direita, pedúnculo cerebral e cerebelo à esquerda. A possibilidade de evento vascular isquêmico agudo deve ser considerada."
    word: true

  - trigger: "balo"
    label: "Esclerose concêntrica de Baló"
    replace: "Área concêntrica \"em camadas\", de aspecto nodular, localizada na substância branca subcortical do lobo parietal à direita, caracterizada por alto sinal T2/FLAIR, apresentando discreta restrição à difusão apenas na periferia, sem realce significativo pelo meio de contraste endovenoso. As possibilidades de lesão com substrato desmielinizante (esclerose concêntrica de Baló ou lesão desmielinizante tumefativa) devem ser consideradas como principais hipóteses diagnósticas. Os diagnósticos diferenciais devem ser aplicados em correlação com dados clínicos e exames laboratoriais."
    word: true

  - trigger: "blackholes"
    label: "Lesões irreversíveis (“black holes”)"
    replace: "Múltiplas lesões hiperintensas na ponderação T2/FLAIR, localizadas na substância branca periventricular e subcortical, bem como na interface calososseptal, no dorso da ponte à esquerda e no bulbo, algumas com maior orientação perpendicular à linha ependimária, que não apresentam restrição à difusão, sugerindo focos de gliose/desmielinização. Destacam-se focos de hipossinal na ponderação T1, localizados na substância branca do centro semioval bilateral, sugestivos de lesões irreversíveis (“black holes”)."
    word: true

  - trigger: "caretal"
