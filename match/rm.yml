  - trigger: "dandy"
    label: "Cateter de derivação cruzando a ponte"
    replace: |-
      Cateter de derivação cruzando a ponte.
      Defeito da calota craniana em região suboccipital direita.
      Pequena área de encefalomalácia/gliose junto ao vérmis/região posteroinferior no hemisfério cerebelar direito que pode estar relacionada à passagem de cateter de derivação.
      Parênquima encefálico supratentorial com morfologia e intensidade de sinal preservadas.
      Fossa posterior de dimensões reduzidas, destacando-se acentuada redução volumétrica do cerebelo com folias proeminentes e alargamento subsequente do 4º ventrículo.
      3º ventrículo de dimensões reduzidas.
      Aspecto pontiagudo do mesencéfalo ("bico mesencefálico").
      O corpo caloso é bem formado.
      Após a administração do gadolínio não foi observado realce anômalo.
    word: true

  - trigger: "dft"
    label: "Doença degenerativa cortical"
    replace: |-
      Descrição:
      Acentuada atrofia cortical dos hemisférios cerebrais, com predomínio nos lobos frontais e temporais, acompanhada de dilatação compensatória desproporcional dos prolongamentos frontais dos ventrículos laterais. Observa-se afilamento cortical acentuado e perda da diferenciação corticossubcortical.

      Conclusão:
      Achados sugestivos de doença degenerativa cortical, sugerindo demência frontotemporal, forma com predomínio frontal. Correlacionar.
    word: true

  - trigger: "dnet"
