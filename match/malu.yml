  - trigger: "supra1"
    label: "Tendinopatia do supra e infraespinhal com rotura focal insercional"
    replace: "Tendinopatia do supra e infraespinhais apresentam leve espessamento e alteração de sinal com pequena rotura focal junto à inserção das fibras do contorno articular na transição de ambos os tendões, com retração de cerca 0,4 cm, comprometendo cerca de 50% da espessura dos tendões nesta topografia, sem lesões transfixantes. Fissuras intra-substanciais próximo à transição miotendínea do infraespinhal, também sem lesões transfixantes."
    word: true

  - trigger: "supra2"
    label: "Tendinopatia moderada do supra e infraespinhal com roturas justainsercionais"
    replace: "Tendinopatia de grau moderado do supraespinhal e do infraespinhal, associada a roturas justa-insercionais, sem áreas de transfixações. Associa-se irregularidade da cortical óssea com edema e cistos subcorticais no tubérculo maior, provavelmente relacionada a entesopatia."
    word: true

  - trigger: "supra3"
    label: "Tendinopatia do supra e infraespinhal com rotura transfixante"
    replace: "Tendinopatia do supra e infraespinhais, com rotura transfixante junto à inserção do supraespinhal e estendendo-se as fibras superiores infraespinhal, com retração proximal s fibras em até 0,6 cm, permanecendo fino feixe de fibras extremidade anterior do supraespinhal normoinseridas, bem como a maior parte das fibras do terço médio e inferior do infraespinhal também"
    word: true

  - trigger: "supra4"
    label: "Tendinopatia do supraespinhal e fibras superiores do infraespinhal"
    replace: "Tendinopatia do supraespinhal e fibras superiores do infraespinhal, com espessamento e alteração de sinal tendíneo, sem roturas/ com focos de degeneração/fissuras intrassubstanciais na região de transição entre esses tendões, sem lesão transfixante. //pequenas fissuras intrassubstanciais junto à inserção na transição de ambos os tendões, sem lesão transfixante."
    word: true

  - trigger: "supra5"
    label: "Rotura parcial intrassubstancial do supraespinhal (< 50%)"
    replace: "Tendinopatia do supraespinhal e do infraespinhal, caracterizada por aumento da espessura tendínea e alteração do sinal habitual, com rotura parcial intrassubstancial no supraespinhal, medindo cerca de 0,7 cm acometendo menos de 50% da espessura tendínea, sem transfixações."
    word: true

  - trigger: "supra6"
    label: "Rotura parcial insercional articular do supraespinhal (> 50%)"
    replace: "Tendinopatia do supraespinhal e do infraespinhal, caracterizada por aumento da espessura tendínea e alteração do sinal habitual, com rotura parcial insercional nas fibras articulares posteriores do supraespinhal e superiores do infraespinhal, medindo cerca de 1,2 cm no transversal e retração de 0,8 cm, acometendo um pouco mais de 50% da espessura tendínea, sem transfixações."
    word: true

  - trigger: "supra7"
    label: "Rotura parcial do contorno bursal/articular do terço médio do supraespinhal"
    replace: "Tendinopatia do supraespinhal e do infraespinhal, com espessamento e alteração de sinal tendíneo, destacando-se rotura parcial das fibras do contorno bursal//articular do terço médio do supraespinhal, medindo 0,4 cm, acometendo menos de 50% da espessura tendínea, sem transfixações."
    word: true

  - trigger: "supra8"
    label: "Rotura extensa insercional das fibras anteriores e médias do supraespinhal"
    replace: "Moderada tendinopatia do supraespinhal, com espessamento e alteração de sinal tendíneo, destacando-se rotura extensa insercional nas fibras anteriores e médias, medindo 0,7 x 0,4 cm ( AP x LL), com aparente transfixação para fibras bursais e articulares, sem retração significativa."
