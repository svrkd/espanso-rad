    word: true

  - trigger: "supra10"
    label: "Rotura transfixante completa do supra e infraespinhal com cisto satélite"
    replace: "Rotura transfixante completa em toda a extensão dos tendões do supraespinhal e infraespinhal, com tendinopatia dos cotos tendíneos e retração em cerca de 3,9 cm, com delaminação intrassubstancial do coto retraído que se estende até a transição miotendínea, onde há formação de cisto satélite medindo até 3,2 cm. Nota-se ainda leve edema na transição miotendínea de ambos os músculos, com líquido laminar no plano miofascial, sugerindo componente de estiramento pós-traumático. Associa -se atrofia e lipossubstituição dos ventres musculares do supra e infraespinhal(grau II de Goutallier)."
    word: true

  - trigger: "supra11"
    label: "Rotura transfixante do supraespinhal no terço médio e anterior"
