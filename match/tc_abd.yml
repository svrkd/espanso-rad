matches:

  # ==========================================================================
  # NEOPLASIAS
  # ==========================================================================

  - trigger: "tcmetabd"
    label: "Metástases abdominais em estudo comparativo"
    replace: |-
      Aumento volumétrico das duas lesões nodulares na parede posterossuperior da bexiga urinária, com realce após a infusão de meio de contraste endovenoso, uma medindo _ cm e outra _ cm (ambas mediam _ cm em _).
      Lesão nodular hipodensa, com centro liquefeito/necrótico, de contornos irregulares, exibindo realce heterogêneo após a infusão de meio de contraste endovenoso, localizada na cavidade peritoneal, adjacente à flexura hepática, medindo _ cm, sugerindo metástase com invasão da parede abdominal.
      Formação nodular, medindo _ cm, com densidade de partes moles e realce heterogêneo após a infusão do meio de contraste endovenoso, localizada na parede abdominal adjacente à lesão supracitada, sem nítidos planos de clivagem com a mesma, sugerindo metástase.
      Lesão hipodensa, com realce após a infusão de meio de contraste endovenoso, localizada no segmento IVa/VIII, adjacente ao sítio de segmentectomia, medindo _ cm, sugerindo metástase com extensão extra-hepática e invasão da parede abdominal e do mediastino inferior.
      Lesão nodular de contornos irregulares, medindo _ cm, localizada na cavidade pélvica à direita, adjacente à anastomose intestinal nessa região, com sinais de invasão do ureter distal ipsilateral, promovendo acentuada dilatação do sistema coletor.
      Linfonodomegalias na cadeia retal superior, sendo que a maior permanece medindo cerca de _ cm.
    word: true

  - trigger: "tctnepanc"
    label: "Tumor neuroendócrino de pâncreas/duodeno"
    replace: Massa heterogênea, predominantemente isodensa, com calcificações grosseiras de permeio, de contornos lobulados e limites parcialmente definidos, medindo _ cm (CC x AP x LL), apresentando intenso realce após a administração do meio de contraste endovenoso, localizada entre o processo uncinado do pâncreas e a 2ª porção do duodeno, envolvendo ramos da artéria e veia mesentéricas superiores, promovendo efeito de massa sobre as estruturas adjacentes, obliterando o colédoco distal e determinando dilatação de vias biliares intra e extra-hepáticas. A possibilidade de tumor neuroendócrino pode ser considerada dentre as possibilidades diagnósticas.
    word: true

  - trigger: "tclesfigind"
    label: "Lesão hepática indeterminada — metástase ou hemangioma"
    replace: Massa heterogênea, predominantemente isodensa, com calcificações grosseiras e áreas císticas de permeio, de contornos lobulados, apresentando realce heterogêneo progressivo e tardio após a administração do meio de contraste endovenoso, localizada no segmento hepático V, medindo cerca de _ cm. Dentre os diagnósticos diferenciais, as possibilidades de metástase ou, mais remotamente, de hemangioma podem ser consideradas.
    word: true

  - trigger: "tclinfoprol"
    label: "Doença linfoproliferativa da raiz do mesentério"
    replace: Formação heterogênea, com realce homogêneo após a administração do meio de contraste endovenoso, de limites bem definidos, envolvendo a raiz do mesentério, circundando em 360º a artéria mesentérica superior e seus ramos, sem obliterá-los, bem como circunjacente aos rins. Associa-se aumento do número e do tamanho dos linfonodos, alguns confluentes, localizados adjacentes à lesão supracitada, em região mesentérica e retroperitoneais (notadamente na altura dos hilos renais), o maior medindo _ cm. Considerar inicialmente a possibilidade de doença linfoproliferativa. Sugere-se prosseguir investigação diagnóstica.
    word: true

  - trigger: "tcpseudmix1"
    label: "Pseudomixoma peritoneal com invasão do reto abdominal"
    replace: |-
      Aumento volumétrico da lesão arredondada heterogênea de contornos levemente irregulares, com calcificações de permeio, infiltrando/obliterando os planos musculoaponeuróticos do reto abdominal esquerdo no hipogástrio, medindo agora _ cm (media _ cm), achado que sugere implante peritoneal com invasão mioaponeurótica.
      Aumento volumétrico dos nódulos peritoneais, o maior no flanco esquerdo, medindo agora _ cm (media _ cm), associados a pequena quantidade de líquido livre na pelve, achados que, no contexto neoplásico primário conhecido, sugerem disseminação neoplásica secundária omentoperitoneal (carcinomatose peritoneal). Associa-se ainda ascite espessa determinando impressão/lobulação junto à borda do lobo hepático direito, sugerindo pseudomixoma peritoneal.
      Aumento volumétrico dos linfonodos retroperitoneais, inguinais e no mesentério, bem como da linfonodomegalia interaortocaval, medindo agora _ cm (media _ cm).
    word: true

  - trigger: "tclipo1"
    label: "Lipossarcoma retroperitoneal"
    replace: Formação expansiva heterogênea, com componentes adiposo e aparentemente sólido de permeio, medindo cerca de _ cm, com epicentro no retroperitônio à direita, determinando abaulamento anterior da fáscia pararrenal posterior e do rim ipsilaterais, assim como efeito expansivo e perda dos planos de clivagem dos músculos quadrado lombar e latíssimo do dorso ipsilaterais. A lesão promove aparente invasão e descontinuidade do 12º arco costal direito, onde se observa coleção hipodensa, com focos gasosos de permeio, medindo cerca de _ cm, com volume de _ cm³. A hipótese de neoplasia retroperitoneal pode ser considerada dentre os diagnósticos diferenciais. A critério clínico, se possível, a tomografia computadorizada com contraste poderá fornecer maiores subsídios diagnósticos.
    word: true

  - trigger: "tclipo2"
    label: "Lipossarcoma periureteral com hidroureteronefrose"
    replace: Formação expansiva ovalada, heterogênea, apresentando áreas com densidade adiposa, septos de permeio e focos cálcicos parietais, localizada adjacente ao ureter direito, medindo cerca de _ cm, distando cerca de _ cm da junção pelveureteral, determinando acentuada hidroureteronefrose à montante, com afilamento do parênquima renal. Há íntimo contato da lesão com a artéria e a veia ilíacas comuns à direita em menos de 180° e com o músculo psoas. Associa-se densificação dos planos gordurosos periureterais e perirrenal. Lesões ovaladas, de contornos pouco definidos, sem realce pelo meio de contraste, localizadas na fossa ilíaca direita, as maiores medindo cerca de _ cm e _ cm. Associa-se densificação dos planos adiposos adjacentes. A possibilidade de lipossarcoma pode ser considerada. Sugere-se prosseguir a investigação diagnóstica.
    word: true

  - trigger: "tcrecid1"
    label: "Recidiva tumoral pélvica com metástases hepáticas e peritoneais"
    replace: |-
      Formação heterogênea sólido-cística, localizada na cavidade pélvica, de limites parcialmente definidos, apresentando íntimo contato e sem planos de clivagem com alças intestinais colônicas e delgadas, parede da bexiga e ureteres, determinando pequena dilatação do sistema coletor renal à direita, medindo _ cm no maior eixo axial, podendo representar recidiva tumoral.
      Múltiplos nódulos hepáticos hipovasculares, de limites definidos, distribuídos difusamente por todo o parênquima, os dois maiores:
      - segmento VII, medindo _ cm;
      - segmento VIII, medindo _ cm.
      Múltiplas lesões nodulares no peritônio, sugerindo metástases, as maiores assim caracterizadas:
      - adjacente ao sítio de colectomia (cavidade pélvica à esquerda), medindo _ cm;
      - junto à borda hepática inferior, medindo _ cm.
    word: true

  - trigger: "tccaprost"
    label: "Adenocarcinoma de próstata com invasão vesical e de vesícula seminal"
    replace: Próstata de volume aumentado, contornos irregulares, limites parcialmente definidos, apresentando realce heterogêneo pelo meio de contraste endovenoso, já biopsiada em _, com diagnóstico anatomopatológico de adenocarcinoma. Observam-se sinais de invasão da vesícula seminal direita, bem como do assoalho e da parede posterior da bexiga, notadamente à direita, mantendo íntimo contato com a parede anterior do reto inferior. A lesão mede cerca de _ cm (LL x AP x CC). Associam-se densificação dos planos adiposos adjacentes, notadamente na fossa ilíaca direita, bem como aumento do número de linfonodos locorregionais, alguns com realce pelo meio de contraste endovenoso. Nota-se ainda moderada hidroureteronefrose à direita, com retardo na excreção do meio de contraste ipsilateral, dada por provável invasão tumoral do óstio ureteral direito.
    word: true

  - trigger: "tcadrenrp"
    label: "Massa adrenal e retroperitoneal com oclusão da veia renal esquerda"
    replace: Massas hipodensas heterogêneas com realce parietal pelo meio de contraste, localizadas na adrenal esquerda e no retroperitônio, medindo cerca de _ cm no maior eixo axial, associadas a linfonodomegalias retroperitoneais e na raiz do mesentério, por vezes confluentes. O conjunto acomete a veia renal esquerda, obliterando-a, bem como envolve a aorta abdominal anteriormente em mais de 180°, estando em íntimo contato com a veia cava inferior, a veia renal direita e a cauda do pâncreas. Os achados são de provável etiologia neoplásica. Sugere-se prosseguir investigação.
    word: true

  - trigger: "tcneoped"
    label: "Neoplasia intra-abdominal disseminada na criança"
    replace: |-
      Múltiplas massas com densidade heterogênea, esparsas na cavidade abdominal, por vezes confluentes, com maior componente localizado no hipocôndrio direito, ocupando os espaços subfrênico e infra-hepático, insinuando-se no epigástrio e no mesogástrio. Há sinais de invasão do parênquima hepático e esplênico. Outras lesões com características semelhantes são identificadas na pelve (notadamente no espaço pararretal direito), nas fossas ilíacas e nos flancos.
      Massa de aspecto sólido-cístico, com finos septos de permeio, sem calcificações, medindo aproximadamente _ cm (CC x LL x AP), com maior componente localizado no mesogástrio/hipogástrio. Tal lesão causa compressão sobre as estruturas adjacentes, deslocando a bexiga e os ureteres, promovendo moderada hidroureteronefrose bilateral.
    word: true

  - trigger: "tcneopedc"
    label: "Conclusão — neoplasia intra-abdominal de origem indeterminada"
    replace: |-
      O conjunto de achados é compatível com neoplasia intra-abdominal, de origem indeterminada.
      Demais achados pormenorizados no corpo do laudo.
    word: true

  - trigger: "tcgermpelv"
    label: "Tumor pélvico de células germinativas (neonato)"
    replace: Massa sólido-cística localizada na pelve, anteriormente ao sacro e ao reto, apresentando realce heterogêneo após a injeção do contraste endovenoso, medindo _ cm, com volume de _ cm³. Tal lesão promove efeito de massa sobre as estruturas adjacentes, deslocando a bexiga e as alças intestinais superoanteriormente, e apresentando íntimo contato com os vasos ilíacos. Associam-se aumento do número e das dimensões de linfonodos retroperitoneais, ilíacos e inguinais superficiais bilateralmente, o maior na cadeia inguinal superficial esquerda, medindo _ cm.
    word: true

  - trigger: "tcgermpelvc"
    label: "Conclusão — massa pélvica sugestiva de tumor de células germinativas"
    replace: Massa heterogênea na pelve, com as linfonodomegalias acima descritas. Considerar inicialmente a possibilidade de neoplasia de células germinativas como principal hipótese diagnóstica, caso haja correlação clínica e laboratorial.
    word: true

  - trigger: "tcfistaort"
    label: "Massa paraórtica com fístula para víscera oca"
    replace: Significativa redução da massa na região paraórtica esquerda, agora apresentando nível hidroaéreo, achado que pode sugerir solução de continuidade/trajeto fistuloso com víscera oca, com paredes espessas, medindo até _ cm (antes media _ cm — AP x CC x LL). A lesão oblitera/indefine o aspecto superior do músculo psoas ipsilateral, com insinuação/extensão no flanco esquerdo, envolvendo, porém sem sinais de invasão da aorta abdominal.
    word: true

  - trigger: "tcbulkyrp"
    label: "Conglomerado linfonodal retroperitoneal bulky (linfoma)"
    replace: Formação expansiva de aspecto infiltrativo, com epicentro no retroperitônio e estendendo-se para o hilo hepático, com padrão hipovascular, envolvendo, porém não invadindo, os vasos do hilo hepático (veia porta e artéria hepática) e os ramos celíacos. Tal lesão mede cerca de _ cm (bulky), determinando compressão extrínseca com significativa redução de calibre da veia porta no segmento hilar e da veia renal esquerda, com consequente ectasia da veia gonadal esquerda e formação de varicosidades pélvicas parauterinas. Associam-se linfonodomegalias retroperitoneais, mesentéricas e pélvicas, medindo até _ cm no menor eixo axial.
    word: true

  - trigger: "tclinfat1"
    label: "Linfonodomegalias retroperitoneais e inguinais atípicas à esquerda"
    replace: Aumento do número e das dimensões dos linfonodos periaórticos, interaortocavais, das cadeias ilíaca e obturatória esquerdas, bem como da região inguinal ipsilateral, formando massas por vezes com conteúdo hipodenso/necrótico, a maior localizada na cadeia periaórtica esquerda, sem nítidos planos de clivagem com a adrenal, apresentando realce heterogêneo pelo meio de contraste, medindo _ cm. Associa-se densificação de planos adiposos no hipocôndrio esquerdo. A possibilidade de acometimento neoplásico secundário pode ser considerada, não se podendo excluir processo infeccioso granulomatoso. Sugere-se prosseguir investigação.
    word: true

  - trigger: "tclinfat2"
    label: "Acometimento linfonodal secundário (câncer de próstata)"
    replace: Linfonodomegalias retroperitoneais, algumas confluentes, acometendo as cadeias para-aórtica, interaortocaval, ilíacas comum e interna à direita e obturatória esquerda, medindo até _ cm nos segmentos passíveis de avaliação na região interaortocaval. Os achados podem estar associados a acometimento secundário.
    word: true

  - trigger: "tclinfat3"
    label: "Linfonodomegalias atípicas ilíacas e inguinais à direita"
    replace: Massas heterogêneas, de contornos irregulares e limites bem definidos, por vezes confluentes, localizadas nas cadeias obturatória, ilíaca externa e inguinais superficial e profunda à direita, as duas maiores medindo _ cm e _ cm no maior eixo axial. Algumas lesões apresentam íntimo contato com a veia ilíaca externa direita. Associam-se aumento e densificação de partes moles adjacentes e na coxa direita, bem como lâminas líquidas que se estendem da goteira parietocólica direita até a região pélvica. O conjunto de achados é sugestivo de linfonodomegalias atípicas, podendo corresponder a acometimento neoplásico secundário.
    word: true

  - trigger: "tclinforp"
    label: "Linfoma retroperitoneal envolvendo os grandes vasos"
    replace: Múltiplas formações sólidas, homogêneas, confluentes, de limites mal definidos, envolvendo o retroperitônio, o hilo esplênico e o hilo hepático, circundando em 360º a aorta e a veia cava inferior (deslocando-as anteriormente), as ilíacas comuns e as ilíacas externas e internas, bem como se estendendo para o subcutâneo das regiões inguinais. Destaca-se redução do calibre com indefinição de parte do sistema venoso, bem como pequena dilatação do sistema coletor renal bilateral, inferindo acometimento pela massa. Associa-se aumento do número e do tamanho dos linfonodos mesentéricos, celíacos e pericólicos, o maior medindo _ cm. O conjunto de achados é sugestivo de doença linfoproliferativa.
    word: true

  - trigger: "tcneogfig"
    label: "Neoplasia gástrica com metástases hepáticas"
    replace: |-
      Imagem diverticular de contornos irregulares, localizada na pequena curvatura gástrica, apresentando comunicação com sua luz e realce após a administração do meio de contraste endovenoso, notadamente parietal, medindo cerca de _ cm (CC x LL x AP). Associam-se aumento do número e do tamanho de linfonodos regionais e junto ao hilo hepático, medindo até _ cm, bem como estase do conteúdo gástrico. O conjunto de achados sugere processo neoplásico primário do estômago. Correlacionar com estudo endoscópico.
      Fígado com dimensões normais, apresentando duas imagens hipodensas, com realce periférico, podendo corresponder a acometimento secundário, assim distribuídas:
      - segmentos II/III, medindo _ cm, determinando efeito de massa e consequente leve dilatação de vias biliares intra-hepáticas;
      - segmento VIII, medindo _ cm.
    word: true

  - trigger: "tcbacolinf"
    label: "Esplenomegalia com linfonodomegalias difusas (linfoma)"
    replace: Baço com volume de _ cm³ e densidade do parênquima homogênea. Associa-se aumento do número e do tamanho de linfonodos retroperitoneais, no hilo hepático, mesentéricos e nas cadeias ilíaca externa e inguinal bilateralmente, o maior na cadeia inguinal esquerda, medindo até _ cm no menor eixo axial. A possibilidade de neoplasia de natureza linfo/mieloproliferativa pode ser considerada dentre os diagnósticos diferenciais.
    word: true

  - trigger: "tcneogcarc"
    label: "Neoplasia gástrica com carcinomatose peritoneal (omental cake)"
    replace: Massa heterogênea, com centro hipodenso, apresentando realce após a injeção do meio de contraste, localizada na topografia da transição gastroesofágica, acometendo o cárdia e o terço proximal da curvatura menor do estômago, medindo cerca de _ cm (CC x AP x LL), com volume estimado em _ cm³. Associam-se acentuada ascite de aspecto espesso, com realce nodular do peritônio, notadamente em topografias peri-hepática, periesplênica e pélvica, onde se observam formações nodulares periféricas que determinam impressão sobre o parênquima hepático. Destacam-se nódulos peritoneais confluentes, formando massas ("omental cake"). Observam-se ainda linfonodomegalias nas cadeias do anel do cárdia, gástricas, do hilo hepático, retroperitoneais e da raiz do mesentério, medindo até _ cm em seus maiores eixos axiais. Os achados sugerem neoplasia gástrica com disseminação neoplásica secundária omentoperitoneal (carcinomatose peritoneal).
    word: true

  - trigger: "tcrecid2"
    label: "Recidiva tumoral em anastomose colo-cólica com abscesso"
    replace: |-
      Discreto aumento volumétrico da massa com centro necrótico e realce pelo meio de contraste na topografia da anastomose colo-cólica esquerda, medindo _ cm (antes media _ cm), obliterando/invadindo o músculo quadrado lombar esquerdo, rechaçando medialmente o músculo psoas ipsilateral e apresentando íntimo contato com o polo inferior do baço, associada a aumento do número de linfonodos mesentéricos e densificação dos planos gordurosos. Não se caracterizam, no presente estudo, trajetos fistulosos com a pele ou sinais de invasão das estruturas ósseas adjacentes.
      Aumento volumétrico da coleção hipodensa com realce parietal e focos gasosos de permeio, adjacente à massa acima descrita, em topografia retroperitoneal/de parede abdominal posterior, medindo agora _ cm (antes media _ cm).
    word: true

  - trigger: "tcrecid2c"
    label: "Conclusão — recidiva tumoral com abscesso intracavitário"
    replace: O conjunto de achados descritos sugere recidiva tumoral complicada com abscesso intracavitário/de parede abdominal posterior como principal consideração diagnóstica.
    word: true

  - trigger: "tcimplpar"
    label: "Implante neoplásico vesical na parede abdominal"
    replace: |-
      Lesão expansiva infiltrativa, de aspecto neoplásico, medindo _ cm, apresentando realce heterogêneo pelo meio de contraste endovenoso, localizada nos planos subcutâneos e mioadiposos da parede abdominal anterior, em região suprapúbica, com predomínio à esquerda da linha média. Associa-se ingurgitamento dos vasos e densificação dos planos gordurosos adjacentes. Notam-se ainda nódulos intraperitoneais localizados posteriormente ao músculo reto abdominal esquerdo, podendo representar implantes peritoneais e/ou linfonodomegalias atípicas, de aspecto metastático.
      Aumento do número de linfonodos retroperitoneais, mesentéricos, pararretais, ilíacos e inguinais, com linfonodomegalias medindo até _ cm nas cadeias ilíaca externa e inguinal esquerdas.
    word: true

  # ==========================================================================
  # OSSO
  # ==========================================================================

  - trigger: "tcchance"
    label: "Fratura de Chance de T12"
    replace: Fratura horizontal do corpo vertebral de T12, determinando achatamento da placa terminal superior, com extensão para pedículo, lâmina e processo transverso esquerdos. Associam-se alargamento do espaço entre os processos espinhosos de T11 e T12, com edema e material denso/hemático em planos mioadiposos adjacentes, insinuando-se para o interior do canal vertebral no nível T11-T12 e promovendo compressão do saco dural posterior, sugerindo ruptura ligamentar posterior (fratura de Chance).
    word: true

  - trigger: "tcverth"
    label: "Vértebras em H (anemia falciforme)"
    replace: Alteração difusa e grosseira do trabeculado ósseo, com depressão da placa terminal central multinível, dando aspecto de vértebras em forma de "H", descritas em pacientes com anemia falciforme.
    word: true

  - trigger: "tcosteocx"
    label: "Osteomielite crônica agudizada da coxa"
    replace: Solução de continuidade e perda de substância de planos mioadiposos da região lateral da coxa proximal direita, associada a coleção hipoatenuante com focos gasosos de permeio, com extensão até o trocanter maior do fêmur, notando-se descontinuidade cortical e destruição óssea focal do mesmo (focos gasosos e material hipoatenuante intraósseo). A coleção mede cerca de _ cm. Associam-se aumento do número e das dimensões de linfonodos das cadeias inguinal direita, ilíaca comum e externa direitas, bem como obturatória e retroperitoneal. O conjunto de achados sugere processo inflamatório/infeccioso crônico acometendo osso e partes moles (osteomielite crônica com componente agudo).
    word: true

  - trigger: "tculcpres1"
    label: "Úlcera de pressão sacrococcígea com acometimento ósseo"
    replace: Densificação e obliteração de partes moles com perda de substância na região posterior sacrococcígea, medindo cerca de _ cm, apresentando íntimo contato com o arco posterior das últimas peças sacrococcígeas, onde se nota esclerose cortical, sugerindo acometimento ósseo. O conjunto de achados acima descrito sugere a possibilidade de processo de natureza inflamatória/infecciosa crônica (úlcera de pressão), com extensão para estruturas ósseas.
    word: true

  - trigger: "tcosteosi"
    label: "Osteomielite crônica sacroilíaca com sequestro e fístula"
    replace: Coleção hipoatenuante, com epicentro no sacro à esquerda, determinando destruição óssea focal com fragmento ósseo central destacado (sequestro ósseo), dissecando para o espaço pré-sacral e as fossas isquiorretal e isquioanal ipsilaterais, com volume aproximado de _ ml, formando trajeto fistuloso com extensão craniocaudal de aproximadamente _ cm, exteriorizando-se na pele/tecido celular subcutâneo na face interna da nádega esquerda. A principal hipótese a ser considerada, em estreita correlação com dados clínicos e laboratoriais, é processo inflamatório/infeccioso crônico acometendo osso e partes moles (osteomielite crônica) da região sacroilíaca esquerda.
    word: true

  - trigger: "tculcpres2"
    label: "Úlcera de pressão sacral com osteomielite crônica"
    replace: Solução de continuidade do tecido subcutâneo da região sacral, com exposição de peças sacrais e áreas de esclerose e afilamento/reabsorção óssea sacrais e ilíaca direita, inferindo osteomielite crônica.
    word: true

  - trigger: "tchemvert"
    label: "Hemangioma vertebral de S1"
    replace: Imagem hipoatenuante no corpo vertebral de S1, que pode corresponder a hemangioma.
    word: true

  - trigger: "tcmetoss"
    label: "Metástases ósseas líticas com invasão de partes moles"
    replace: Lesões ósseas insuflativas, predominantemente líticas, algumas com componentes escleróticos, localizadas no 9º arco costal à esquerda, nos corpos vertebrais de L3 e L4 (com extensão para os pedículos e redução da altura de L3), na crista ilíaca esquerda, no processo espinhoso de L1 e nos processos transversos bilaterais de T12. Associa-se invasão de partes moles adjacentes às lesões. O conjunto de achados sugere implantes neoplásicos secundários.
    word: true

