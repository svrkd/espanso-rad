matches:
  # ==========================================================================
  # ANGIOTOMOGRAFIA DE TÓRAX — ARTÉRIAS PULMONARES
  # ==========================================================================
  - trigger: "tepcentro"
    label: "TEP agudo central (artéria pulmonar principal/direita/esquerda)"
    replace: "Falhas de enchimento intraluminais bem delimitadas, formando ângulo agudo com a parede vascular, na artéria pulmonar _, estendendo-se aos ramos lobares, segmentares e subsegmentares _, compatíveis com tromboembolismo pulmonar agudo."
    word: true

  - trigger: "tepcentroc"
    label: "Conclusão — TEP agudo central (PE-RADS 4)"
    replace: "Tromboembolismo pulmonar agudo central, acometendo a artéria pulmonar _ (PE-RADS 4)."
    word: true

  - trigger: "teplobo"
    label: "TEP agudo lobar"
    replace: "Falhas de enchimento intraluminais bem delimitadas, formando ângulo agudo com a parede vascular, na artéria lobar _, estendendo-se a ramos segmentares e subsegmentares, compatíveis com tromboembolismo pulmonar agudo."
    word: true

  - trigger: "teploboc"
    label: "Conclusão — TEP agudo lobar (PE-RADS 3)"
    replace: "Tromboembolismo pulmonar agudo, com trombo mais proximal na artéria lobar _ (PE-RADS 3)."
    word: true

  - trigger: "tepvd"
    label: "Aumento do ventrículo direito (VD/VE ≥ 1,0)"
    replace: "Aumento do ventrículo direito, com relação entre os diâmetros dos ventrículos direito e esquerdo de _ (≥ 1,0), associado a retificação do septo interventricular. Associa-se refluxo do meio de contraste para a veia cava inferior e veias hepáticas."
    word: true

  - trigger: "tepvdc"
    label: "Conclusão — aumento do ventrículo direito (PE-RADS RV+)"
    replace: "Aumento do ventrículo direito (modificador RV+ do PE-RADS)."
    word: true

  - trigger: "tepsela"
    label: "TEP agudo em sela"
    replace: "Falha de enchimento cavalgando a bifurcação do tronco pulmonar e estendendo-se às artérias pulmonares direita e esquerda (trombo em sela), bem como aos ramos lobares, segmentares e subsegmentares bilateralmente, compatível com tromboembolismo pulmonar agudo."
    word: true

  - trigger: "tepselac"
    label: "Conclusão — TEP agudo em sela (PE-RADS 4)"
    replace: "Tromboembolismo pulmonar agudo com trombo em sela na bifurcação do tronco pulmonar (PE-RADS 4)."
    word: true

  - trigger: "tepsub"
    label: "TEP subsegmentar isolado"
    replace: "Falha de enchimento em ramo subsegmentar da artéria pulmonar do segmento _ do lobo _, identificada em mais de um plano, compatível com tromboembolismo pulmonar."
    word: true

  - trigger: "tepsubc"
    label: "Conclusão — TEP subsegmentar isolado (PE-RADS 1)"
    replace: "Tromboembolismo pulmonar subsegmentar isolado no lobo _ (PE-RADS 1)."
    word: true

  - trigger: "tepfalso"
    label: "Artefato de interrupção transitória do contraste"
    replace: "Heterogeneidade da opacificação do tronco e das artérias pulmonares, com atenuação inferior à da aorta e influxo do meio de contraste preservado na veia cava superior, sem falha de enchimento definida, compatível com interrupção transitória do contraste por influxo de sangue não opacificado proveniente da veia cava inferior, limitando a avaliação dos ramos _."
    word: true

  - trigger: "tepfalsoc"
    label: "Conclusão — artefato de interrupção transitória do contraste"
    replace: "Artefato de interrupção transitória do contraste, limitando a avaliação dos ramos _ da artéria pulmonar."
    word: true

  - trigger: "teptransito"
    label: "Trombo em trânsito nas câmaras direitas"
    replace: "Falha de enchimento alongada e serpiginosa no átrio direito, medindo _ cm, sem aderência parietal definida, compatível com trombo em trânsito."
    word: true

  - trigger: "teptransitoc"
    label: "Conclusão — trombo em trânsito (PE-RADS T+)"
    replace: "Trombo em trânsito no átrio direito (modificador T+ do PE-RADS)."
    word: true

  - trigger: "troncop2"
    label: "Hipertensão pulmonar (tronco e razão AP/Ao)"
    replace: "Aumento do calibre do tronco pulmonar (_ cm), com razão entre os diâmetros do tronco pulmonar e da aorta ascendente de _ (> 0,9), sugerindo hipertensão pulmonar."
    word: true

  - trigger: "troncop2c"
    label: "Conclusão — sinais de hipertensão pulmonar"
    replace: "Sinais tomográficos sugestivos de hipertensão pulmonar, na dependência de correlação ecocardiográfica."
    word: true

  - trigger: "tepcronico"
    label: "Doença tromboembólica pulmonar crônica"
    replace: "Falhas de enchimento excêntricas e lineares, aderidas à parede e formando ângulo obtuso com a parede vascular, sem expansão do vaso, na artéria pulmonar _ e nos ramos lobares _, associadas a redes e bandas intraluminais, bem como a amputação abrupta e afilamento de ramos segmentares. Associa-se atenuação em mosaico do parênquima pulmonar, bem como aumento das artérias brônquicas."
    word: true

  - trigger: "tepcronicoc"
    label: "Conclusão — doença tromboembólica pulmonar crônica"
    replace: "Achados compatíveis com doença tromboembólica pulmonar crônica."
    word: true

  - trigger: "mavpulmao"
    label: "Malformação arteriovenosa pulmonar"
    replace: "Malformação arteriovenosa pulmonar no segmento _ do lobo _, caracterizada por saco aneurismático de _ cm, nutrida por artéria de _ cm de calibre e drenada por veia pulmonar dilatada."
    word: true

  - trigger: "mavpulmaoc"
    label: "Conclusão — malformação arteriovenosa pulmonar"
    replace: "Malformação arteriovenosa pulmonar no lobo _."
    word: true

  - trigger: "pseudopulmonar"
    label: "Pseudoaneurisma de ramo da artéria pulmonar"
    replace: "Dilatação sacular de ramo _ da artéria pulmonar do lobo _, medindo _ cm, com opacificação concomitante à do leito arterial pulmonar, sugerindo pseudoaneurisma. Os diagnósticos diferenciais etiológicos incluem infecção (aneurisma de Rasmussen, êmbolo séptico), iatrogenia (cateter de artéria pulmonar), trauma e vasculite (doença de Behçet), entre outros."
    word: true

  - trigger: "pseudopulmonarc"
    label: "Conclusão — pseudoaneurisma de artéria pulmonar"
    replace: "Pseudoaneurisma de ramo da artéria pulmonar do lobo _."
    word: true

  - trigger: "pulmonarausente"
    label: "Interrupção proximal da artéria pulmonar"
    replace: "Ausência da artéria pulmonar _ (interrupção proximal), com redução volumétrica do pulmão ipsilateral, irrigado por colaterais sistêmicas hipertrofiadas (artérias brônquicas, intercostais e transpleurais)."
    word: true

  - trigger: "pulmonarausentec"
    label: "Conclusão — interrupção proximal da artéria pulmonar"
    replace: "Interrupção proximal (ausência) da artéria pulmonar _, com circulação colateral sistêmica."
    word: true

  - trigger: "slingpulmonar"
    label: "Sling da artéria pulmonar"
    replace: "Artéria pulmonar esquerda originando-se da artéria pulmonar direita e cursando entre a traqueia e o esôfago, compatível com sling da artéria pulmonar."
    word: true

  # ==========================================================================
  # ANGIOTOMOGRAFIA DE TÓRAX — AORTA TORÁCICA
  # ==========================================================================
  - trigger: "aneuascendente"
    label: "Aneurisma da aorta ascendente"
    replace: "Dilatação aneurismática fusiforme da aorta ascendente, com diâmetro máximo de _ cm (medido perpendicularmente ao eixo do fluxo), estendendo-se por cerca de _ cm, sem comprometimento da raiz aórtica."
    word: true

  - trigger: "aneuascendentec"
    label: "Conclusão — aneurisma da aorta ascendente"
    replace: "Aneurisma fusiforme da aorta ascendente."
    word: true

  - trigger: "aneudescendente"
    label: "Aneurisma da aorta torácica descendente"
    replace: "Dilatação aneurismática fusiforme da aorta torácica descendente, com diâmetro máximo de _ cm (medido perpendicularmente ao eixo do fluxo, de borda externa a borda externa), estendendo-se do nível de _ até _, com trombo mural excêntrico de até _ cm de espessura."
    word: true

  - trigger: "aneudescendentec"
    label: "Conclusão — aneurisma da aorta descendente"
    replace: "Aneurisma fusiforme da aorta torácica descendente, com trombo mural."
    word: true

  - trigger: "aortaulcera"
    label: "Úlcera aterosclerótica penetrante"
    replace: "Projeção focal do meio de contraste além do contorno luminal da aorta _, em meio a placas ateromatosas, com profundidade de _ cm e colo de _ cm, compatível com úlcera aterosclerótica penetrante."
    word: true

  - trigger: "aortaulcerac"
    label: "Conclusão — úlcera aterosclerótica penetrante"
    replace: "Úlcera aterosclerótica penetrante na aorta _."
    word: true

  - trigger: "flapb"
    label: "Dissecção aórtica Stanford B"
    replace: "Retalho intimal na aorta torácica, poupando a aorta ascendente, com rotura intimal de entrada na zona _ e extensão da zona _ à zona _ (zonas SVS/STS), delimitando luz verdadeira de menor calibre e luz falsa de maior calibre, compatível com dissecção aórtica Stanford tipo B. Ramos viscerais emergindo da luz verdadeira, exceto _."
    word: true

  - trigger: "flapbc"
    label: "Conclusão — dissecção aórtica Stanford B"
    replace: "Dissecção aórtica Stanford tipo B (SVS/STS: tipo B, extensão proximal na zona _ e distal na zona _)."
    word: true

  - trigger: "flapa"
    label: "Dissecção aórtica Stanford A"
    replace: "Retalho intimal na aorta ascendente, estendendo-se ao arco e à aorta descendente até _, delimitando luz verdadeira de menor calibre e luz falsa de maior calibre, com rotura intimal de entrada a cerca de _ cm acima da junção sinotubular, compatível com dissecção aórtica Stanford tipo A. Associa-se extensão do retalho intimal para _."
    word: true

  - trigger: "flapac"
    label: "Conclusão — dissecção aórtica Stanford A"
    replace: "Dissecção aórtica Stanford tipo A, estendendo-se até _."
    word: true

  - trigger: "hematomural"
    label: "Hematoma intramural da aorta"
    replace: "Espessamento parietal em crescente da aorta _, com até _ cm de espessura (> 0,5 cm), espontaneamente hiperatenuante na fase sem contraste e sem realce após o meio de contraste endovenoso, estendendo-se por cerca de _ cm, sem retalho intimal ou rotura intimal identificável, compatível com hematoma intramural. Associa-se deslocamento central das calcificações intimais."
    word: true

  - trigger: "hematomuralc"
    label: "Conclusão — hematoma intramural da aorta"
    replace: "Hematoma intramural da aorta _ (Stanford tipo _)."
    word: true

  - trigger: "endopervia"
    label: "Endoprótese aórtica torácica sem endoleak"
    replace: "Endoprótese na aorta torácica descendente, estendendo-se de _ a _, pérvia e bem posicionada, com boa aposição às zonas de ancoragem, sem extravasamento do meio de contraste para o saco aneurismático, que mede _ cm (no exame anterior: _ cm)."
    word: true

  - trigger: "endoperviac"
    label: "Conclusão — endoprótese torácica sem endoleak"
    replace: "Endoprótese aórtica torácica pérvia, sem sinais de vazamento (endoleak)."
    word: true

  - trigger: "endovaza"
    label: "Endoleak de endoprótese torácica"
    replace: "Opacificação pelo meio de contraste no interior do saco aneurismático, externamente à endoprótese, junto à _, compatível com vazamento (endoleak) tipo _. Saco aneurismático medindo _ cm (no exame anterior: _ cm)."
    word: true

  - trigger: "endovazac"
    label: "Conclusão — endoleak de endoprótese torácica"
    replace: "Vazamento (endoleak) tipo _ da endoprótese aórtica torácica."
    word: true

  - trigger: "tuboaorta"
    label: "Enxerto tubular da aorta ascendente"
    replace: "Status pós-operatório de substituição da aorta ascendente por enxerto tubular, pérvio, sem coleções periprotéticas ou pseudoaneurismas anastomóticos."
    word: true

  - trigger: "aortatrauma"
    label: "Lesão aórtica traumática (pseudoaneurisma do istmo)"
    replace: "Pseudoaneurisma sacular no istmo aórtico, junto à inserção do ligamento arterioso, medindo _ cm, compatível com lesão aórtica traumática grau III (classificação SVS). Associa-se hematoma mediastinal periaórtico."
    word: true

  - trigger: "aortatraumac"
    label: "Conclusão — lesão aórtica traumática"
    replace: "Lesão aórtica traumática grau III (pseudoaneurisma do istmo aórtico), com hematoma mediastinal."
    word: true

  - trigger: "coarctacao"
    label: "Coarctação da aorta"
    replace: "Estreitamento focal da aorta no istmo, distalmente à emergência da artéria subclávia esquerda, com calibre mínimo de _ cm (aorta descendente no nível do hiato diafragmático: _ cm), compatível com coarctação da aorta. Associa-se circulação colateral exuberante pelas artérias torácicas internas e intercostais, bem como erosões nas margens inferiores de arcos costais."
    word: true

  - trigger: "coarctacaoc"
    label: "Conclusão — coarctação da aorta"
    replace: "Coarctação da aorta, com circulação colateral."
    word: true

  - trigger: "aortitetorax"
    label: "Aortite (espessamento parietal circunferencial)"
    replace: "Espessamento parietal circunferencial e regular da aorta _, com até _ cm de espessura, apresentando realce tardio pelo meio de contraste endovenoso, sugerindo aortite. Os diagnósticos diferenciais incluem arterite de Takayasu, arterite de células gigantes, doença relacionada à IgG4 e aortite infecciosa, entre outros."
    word: true

  - trigger: "aortitetoraxc"
    label: "Conclusão — aortite"
    replace: "Espessamento parietal circunferencial da aorta _, sugestivo de aortite."
    word: true

  # ==========================================================================
  # ANGIOTOMOGRAFIA DE TÓRAX — ARCO AÓRTICO E VARIANTES
  # ==========================================================================
  - trigger: "troncocomum"
    label: "Tronco comum braquiocefálico-carotídeo"
    replace: "Tronco braquiocefálico e artéria carótida comum esquerda originando-se de tronco comum no arco aórtico (variação anatômica)."
    word: true

  - trigger: "diverticuloductal"
    label: "Divertículo ductal"
    replace: "Abaulamento focal de contornos lisos na face anteromedial do istmo aórtico, formando ângulos obtusos com a parede, sem hematoma mediastinal, compatível com divertículo ductal (variação anatômica)."
    word: true

  - trigger: "lusoriadiverticulo"
    label: "Subclávia direita aberrante com divertículo de Kommerell"
    replace: "Artéria subclávia direita aberrante originando-se como último ramo do arco aórtico, a partir de divertículo de Kommerell com _ cm de diâmetro, e cursando posteriormente ao esôfago. Associa-se impressão extrínseca na parede posterior do esôfago."
    word: true

  - trigger: "lusoriadiverticuloc"
    label: "Conclusão — subclávia aberrante com Kommerell"
    replace: "Artéria subclávia direita aberrante (lusória) com divertículo de Kommerell."
    word: true

  - trigger: "arcodireito"
    label: "Arco à direita com subclávia esquerda aberrante"
    replace: "Arco aórtico à direita, com artéria subclávia esquerda aberrante originando-se como último ramo, a partir de divertículo de Kommerell de _ cm, e cursando posteriormente ao esôfago, aspecto que pode configurar anel vascular completado pelo ligamento arterioso."
    word: true

  - trigger: "arcodireitoc"
    label: "Conclusão — arco à direita com subclávia esquerda aberrante"
    replace: "Arco aórtico à direita com artéria subclávia esquerda aberrante e divertículo de Kommerell."
    word: true

  - trigger: "arcoespelho"
    label: "Arco à direita com ramificação em espelho"
    replace: "Arco aórtico à direita com ramificação em imagem em espelho, sendo o primeiro ramo o tronco braquiocefálico esquerdo, seguido das artérias carótida comum direita e subclávia direita."
    word: true

  - trigger: "arcoespelhoc"
    label: "Conclusão — arco à direita em espelho"
    replace: "Arco aórtico à direita com ramificação em imagem em espelho."
    word: true

  - trigger: "duploarco"
    label: "Duplo arco aórtico"
    replace: "Duplo arco aórtico, com arcos direito (_ cm) e esquerdo (_ cm) circundando a traqueia e o esôfago e unindo-se posteriormente na aorta descendente, cada um originando as artérias carótida comum e subclávia ipsilaterais, com dominância do arco _."
    word: true

  - trigger: "duploarcoc"
    label: "Conclusão — duplo arco aórtico"
    replace: "Duplo arco aórtico (anel vascular completo)."
    word: true

  # ==========================================================================
  # ANGIOTOMOGRAFIA DE TÓRAX — VEIAS SISTÊMICAS
  # ==========================================================================
  - trigger: "misturacava"
    label: "Artefato de mistura na veia cava superior"
    replace: "Heterogeneidade da opacificação da veia cava superior por mistura com sangue não opacificado proveniente da veia braquiocefálica contralateral e da veia ázigos, sem falha de enchimento persistente, aspecto relacionado a artefato de fluxo."
    word: true

  - trigger: "trombocateter"
    label: "Trombo relacionado a cateter venoso central"
    replace: "Falha de enchimento junto à extremidade do cateter venoso central, na _, medindo _ cm, compatível com trombo relacionado ao cateter."
    word: true

  - trigger: "trombocateterc"
    label: "Conclusão — trombo relacionado a cateter"
    replace: "Trombo relacionado ao cateter venoso central na _."
    word: true

  - trigger: "cavaocluida"
    label: "Obstrução da veia cava superior com colaterais"
    replace: "Oclusão da veia cava superior por _, estendendo-se por cerca de _ cm a partir da confluência das veias braquiocefálicas. Associa-se circulação colateral exuberante pelos sistemas ázigos/hemiázigos, torácico interno e venoso da parede torácica."
    word: true

  - trigger: "cavaocluidac"
    label: "Conclusão — obstrução da veia cava superior"
    replace: "Obstrução da veia cava superior por _, com circulação colateral."
    word: true

  - trigger: "loboazigos"
    label: "Lobo ázigos"
    replace: "Lobo ázigos, delimitado por fissura acessória que contém a veia ázigos (variação anatômica)."
    word: true

  - trigger: "retroaortica"
    label: "Veia braquiocefálica esquerda retroaórtica"
    replace: "Veia braquiocefálica esquerda com trajeto retroaórtico, cursando inferiormente ao arco aórtico antes de desembocar na veia cava superior (variação anatômica)."
    word: true

  - trigger: "continuacaoazigos"
    label: "Continuação ázigos da veia cava inferior"
    replace: "Interrupção do segmento intra-hepático da veia cava inferior, com continuação pela veia ázigos, dilatada (_ cm), que drena na veia cava superior, e veias hepáticas drenando diretamente no átrio direito."
    word: true

  - trigger: "continuacaoazigosc"
    label: "Conclusão — continuação ázigos da veia cava inferior"
    replace: "Continuação ázigos da veia cava inferior (variação anatômica)."
    word: true

  # ==========================================================================
  # ANGIOTOMOGRAFIA DE TÓRAX — VEIAS PULMONARES
  # ==========================================================================
  - trigger: "troncovenoso"
    label: "Tronco comum das veias pulmonares esquerdas"
    replace: "Veias pulmonares superior e inferior esquerdas confluindo em tronco comum antes de desembocar no átrio esquerdo (variação anatômica)."
    word: true

  - trigger: "veiamedia"
    label: "Veia pulmonar média direita acessória"
    replace: "Veia pulmonar média direita acessória, drenando separadamente no átrio esquerdo (variação anatômica)."
    word: true

  - trigger: "drenagemesquerda"
    label: "Drenagem venosa anômala parcial esquerda (veia vertical)"
    replace: "Veia pulmonar superior esquerda drenando na veia braquiocefálica esquerda por meio de veia vertical que cursa lateralmente ao arco aórtico, compatível com drenagem venosa pulmonar anômala parcial."
    word: true

  - trigger: "drenagemesquerdac"
    label: "Conclusão — drenagem venosa anômala parcial esquerda"
    replace: "Drenagem venosa pulmonar anômala parcial da veia pulmonar superior esquerda para a veia braquiocefálica esquerda."
    word: true

  - trigger: "drenagemdireita"
    label: "Drenagem venosa anômala parcial direita (VCS)"
    replace: "Veias pulmonares do lobo superior direito drenando na veia cava superior, compatível com drenagem venosa pulmonar anômala parcial, não podendo ser descartada comunicação interatrial do tipo seio venoso superior."
    word: true

  - trigger: "drenagemdireitac"
    label: "Conclusão — drenagem venosa anômala parcial direita"
    replace: "Drenagem venosa pulmonar anômala parcial do lobo superior direito para a veia cava superior, recomendando-se correlação ecocardiográfica para pesquisa de comunicação interatrial do tipo seio venoso."
    word: true

  - trigger: "cimitarra"
    label: "Síndrome da cimitarra"
    replace: "Veia pulmonar anômala de trajeto curvilíneo, drenando o pulmão direito na veia cava inferior (veia em cimitarra), com hipoplasia do pulmão direito e dextroposição cardíaca, compatível com síndrome da cimitarra."
    word: true

  - trigger: "cimitarrac"
    label: "Conclusão — síndrome da cimitarra"
    replace: "Síndrome da cimitarra (drenagem venosa pulmonar anômala parcial para a veia cava inferior)."
    word: true

  - trigger: "estenoseveia"
    label: "Estenose de veia pulmonar"
    replace: "Redução do calibre do óstio da veia pulmonar _, com diâmetro de _ cm (redução de cerca de _% em relação a _), compatível com estenose de veia pulmonar."
    word: true

  - trigger: "estenoseveiac"
    label: "Conclusão — estenose de veia pulmonar"
    replace: "Estenose _ do óstio da veia pulmonar _."
    word: true

  # ==========================================================================
  # ANGIOTOMOGRAFIA DE TÓRAX — CIRCULAÇÃO SISTÊMICA PULMONAR
  # ==========================================================================
  - trigger: "bronquicas"
    label: "Hipertrofia das artérias brônquicas"
    replace: "Artérias brônquicas hipertróficas e tortuosas, com calibre de até _ cm na origem (> 0,2 cm), originando-se da aorta torácica descendente no nível de _ e dirigindo-se ao hilo _."
    word: true

  - trigger: "bronquicasc"
    label: "Conclusão — hipertrofia das artérias brônquicas"
    replace: "Hipertrofia das artérias brônquicas."
    word: true

  - trigger: "sequestropulmonar"
    label: "Sequestro pulmonar"
    replace: "Área de consolidação com componentes císticos no segmento basal posterior do lobo inferior _, irrigada por artéria sistêmica aberrante de _ cm, originada da aorta _, com drenagem venosa para _, compatível com sequestro pulmonar _."
    word: true

  - trigger: "sequestropulmonarc"
    label: "Conclusão — sequestro pulmonar"
    replace: "Sequestro pulmonar _ no lobo inferior _, com artéria nutridora oriunda da aorta _."
    word: true

  # ==========================================================================
  # ANGIOTOMOGRAFIA ENCEFÁLICA — ASPECTO NORMAL
  # ==========================================================================
  - trigger: "angioarterialnl"
    label: "Artérias intracranianas normais (angio-TC)"
    replace: "Segmentos intracranianos das artérias carótidas internas e vertebrais, artéria basilar e artérias cerebrais anteriores, médias e posteriores com trajeto, calibre e contornos preservados, sem estenoses, oclusões ou dilatações aneurismáticas."
    word: true

